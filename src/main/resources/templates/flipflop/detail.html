<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: base(~{::title}, ~{::main})}">
<head>
    <title th:text="${flipFlop.title} + ' — 팩트로그'">발언 상세</title>
</head>
<body>
<main class="page-narrow">

    <div th:if="${successMessage}" class="alert alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <!-- 헤더 -->
    <div class="detail-card">
        <div class="detail-meta-row">
            <span class="badge badge-politician">
                <i class="bi bi-person-fill"></i>
                <span th:text="${flipFlop.politicianName}"></span>
            </span>
            <span class="meta-pill"><i class="bi bi-eye"></i> <span th:text="${flipFlop.viewCount}"></span></span>
            <span class="meta-pill"><i class="bi bi-chat"></i> <span th:text="${#lists.size(flipFlop.comments)}"></span></span>
            <span class="meta-pill" th:text="${#temporals.format(flipFlop.createdAt, 'yyyy.MM.dd')}"></span>
        </div>

        <h1 class="detail-title" th:text="${flipFlop.title}"></h1>

        <div sec:authorize="hasRole('ADMIN')" class="detail-action-row">
            <a th:href="@{/flipflop/{id}/edit(id=${flipFlop.id})}" class="btn btn-outline btn-sm">
                <i class="bi bi-pencil"></i> 수정
            </a>
            <form th:action="@{/flipflop/{id}/delete(id=${flipFlop.id})}" method="post"
                  onsubmit="return confirm('정말 삭제하시겠습니까?')">
                <button type="submit" class="btn btn-danger btn-sm">
                    <i class="bi bi-trash"></i> 삭제
                </button>
            </form>
        </div>
    </div>

    <!-- 발언 비교 -->
    <div class="ff-detail">
        <div class="ff-detail-col before">
            <div class="ff-section-label before">
                <i class="bi bi-clock-history"></i> 이전 발언
            </div>
            <div class="ff-section-date">
                <i class="bi bi-calendar-event"></i>
                <span th:text="${#temporals.format(flipFlop.beforeDate, 'yyyy년 MM월 dd일')}"></span>
            </div>
            <blockquote class="ff-blockquote" th:text="${flipFlop.beforeStatement}"></blockquote>
            <a th:href="${flipFlop.beforeSource}" target="_blank" rel="noopener noreferrer" class="source-link">
                <i class="bi bi-newspaper"></i> 뉴스 출처 확인
                <i class="bi bi-box-arrow-up-right" style="font-size:10px;"></i>
            </a>
        </div>

        <div class="ff-detail-divider">
            <div class="ff-arrow-circle" style="width:34px;height:34px;font-size:14px;">
                <i class="bi bi-arrow-right"></i>
            </div>
            <div class="ff-divider-label">변화</div>
        </div>

        <div class="ff-detail-col after">
            <div class="ff-section-label after">
                <i class="bi bi-mic-fill"></i> 현재 발언
            </div>
            <div class="ff-section-date">
                <i class="bi bi-calendar-event"></i>
                <span th:text="${#temporals.format(flipFlop.afterDate, 'yyyy년 MM월 dd일')}"></span>
            </div>
            <blockquote class="ff-blockquote" th:text="${flipFlop.afterStatement}"></blockquote>
            <a th:href="${flipFlop.afterSource}" target="_blank" rel="noopener noreferrer" class="source-link">
                <i class="bi bi-newspaper"></i> 뉴스 출처 확인
                <i class="bi bi-box-arrow-up-right" style="font-size:10px;"></i>
            </a>
        </div>
    </div>

    <!-- 댓글 -->
    <div class="comment-wrap">
        <div class="comment-head">
            <i class="bi bi-chat-dots" style="color:var(--color-primary);"></i>
            댓글
            <span class="comment-count-chip" th:text="${#lists.size(flipFlop.comments)}"></span>
        </div>

        <div sec:authorize="isAuthenticated()" class="comment-input-area">
            <form th:action="@{/comment/flipflop/{id}(id=${flipFlop.id})}" method="post">
                <div class="comment-input-row">
                    <textarea class="comment-textarea" name="content" rows="2"
                              placeholder="이 발언에 대한 의견을 남겨보세요..."></textarea>
                    <button type="submit" class="btn btn-primary">등록</button>
                </div>
            </form>
        </div>
        <div sec:authorize="!isAuthenticated()" class="comment-login">
            <i class="bi bi-lock" style="display:block;font-size:18px;margin-bottom:6px;"></i>
            <a th:href="@{/member/login}">로그인</a> 후 댓글을 작성할 수 있습니다.
        </div>

        <div th:if="${#lists.isEmpty(flipFlop.comments)}" class="empty" style="padding:2rem;">
            <p>첫 번째 댓글을 작성해보세요!</p>
        </div>

        <div th:each="comment : ${flipFlop.comments}" class="comment-item">
            <div class="comment-avatar" th:text="${#strings.substring(comment.author.nickname, 0, 1)}"></div>
            <div class="comment-body">
                <div class="comment-meta">
                    <span class="comment-author" th:text="${comment.author.nickname}"></span>
                    <span class="comment-date" th:text="${#temporals.format(comment.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
                    <form th:if="${currentMember != null and (currentMember.id == comment.author.id or currentMember.admin)}"
                          th:action="@{/comment/{id}/delete(id=${comment.id})}" method="post" style="margin-left:auto;">
                        <input type="hidden" name="redirectUrl" th:value="@{/flipflop/{id}(id=${flipFlop.id})}">
                        <button type="submit" class="comment-del-btn"
                                onclick="return confirm('댓글을 삭제하시겠습니까?')">
                            <i class="bi bi-trash"></i> 삭제
                        </button>
                    </form>
                </div>
                <div class="comment-text" th:text="${comment.content}"></div>
            </div>
        </div>
    </div>

    <a th:href="@{/flipflop}" class="btn btn-outline">
        <i class="bi bi-arrow-left"></i> 목록으로
    </a>

</main>
</body>
</html>
