<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::title}, ~{::main})}">
<head>
    <title>내 제보 내역 — 팩트로그</title>
</head>
<body>
<main class="page-narrow">

    <div class="page-header">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
            <h1 class="page-title">
                <span class="title-icon" style="background:#fef9c3;color:#ca8a04;">📋</span>
                내 제보 내역
            </h1>
            <a th:href="@{/news-tip/create}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-circle"></i> 새 제보하기
            </a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" style="margin-bottom:1rem;">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <!-- 안내 배너 -->
    <div class="card" style="margin-bottom:1.5rem;background:#fefce8;border:1px solid #fde68a;">
        <div class="card-body" style="padding:14px 18px;">
            <p style="font-size:0.85rem;color:#92400e;margin:0;line-height:1.6;">
                <i class="bi bi-info-circle-fill" style="color:#ca8a04;"></i>
                제보 내용은 관리자가 검토 후 팩트로그에 등록됩니다.
                거절된 경우 사유를 확인하고 수정하여 다시 제보하실 수 있습니다.
            </p>
        </div>
    </div>

    <!-- 제보 없을 때 -->
    <div th:if="${tips.isEmpty()}" class="card">
        <div class="empty">
            <div class="empty-icon">📭</div>
            <h4>아직 제보한 내용이 없습니다</h4>
            <p>정치인의 말 바꾸기 사례를 발견하셨나요?</p>
            <a th:href="@{/news-tip/create}" class="btn btn-primary" style="margin-top:1rem;">
                <i class="bi bi-newspaper"></i> 첫 제보하기
            </a>
        </div>
    </div>

    <!-- 제보 목록 -->
    <div th:each="tip : ${tips}" class="card" style="margin-bottom:1rem;">
        <div class="card-body">

            <!-- 헤더 행 -->
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:10px;">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <span style="font-size:0.78rem;font-weight:700;padding:3px 10px;border-radius:999px;"
                          th:classappend="${tip.status.name() == 'PENDING'} ? '' : ''"
                          th:style="${tip.status.name() == 'PENDING'} ? 'color:#f59e0b;background:#fffbeb;' :
                                    (${tip.status.name() == 'REVIEWED'} ? 'color:#10b981;background:#ecfdf5;' :
                                    'color:#ef4444;background:#fef2f2;')">
                        <th:block th:if="${tip.status.name() == 'PENDING'}">⏳ 검토 대기</th:block>
                        <th:block th:if="${tip.status.name() == 'REVIEWED'}">✅ 반영 완료</th:block>
                        <th:block th:if="${tip.status.name() == 'REJECTED'}">❌ 거절됨</th:block>
                    </span>
                    <span class="badge badge-politician">
                        <i class="bi bi-person-fill"></i>
                        <span th:text="${tip.politicianName}"></span>
                    </span>
                </div>
                <span style="font-size:0.8rem;color:var(--slate-400);flex-shrink:0;"
                      th:text="${#temporals.format(tip.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
            </div>

            <!-- 제보 내용 미리보기 -->
            <p style="font-size:0.9rem;color:var(--slate-700);line-height:1.6;margin-bottom:10px;"
               th:text="${#strings.abbreviate(tip.description, 150)}"></p>

            <!-- 뉴스 링크 -->
            <div style="margin-bottom:10px;">
                <a th:href="${tip.newsUrl}" target="_blank"
                   style="font-size:0.82rem;color:var(--color-primary);display:inline-flex;align-items:center;gap:4px;">
                    <i class="bi bi-box-arrow-up-right"></i>
                    <span th:text="${#strings.abbreviate(tip.newsUrl, 60)}"></span>
                </a>
            </div>

            <!-- 거절 사유 (있을 때만) -->
            <div th:if="${tip.status.name() == 'REJECTED' and tip.adminNote != null and !tip.adminNote.isEmpty()}"
                 style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 14px;margin-top:10px;">
                <p style="font-size:0.8rem;font-weight:700;color:#dc2626;margin-bottom:4px;">
                    <i class="bi bi-x-circle-fill"></i> 거절 사유
                </p>
                <p style="font-size:0.85rem;color:#7f1d1d;margin:0;line-height:1.5;"
                   th:text="${tip.adminNote}"></p>
            </div>

            <!-- 거절됐는데 사유 없을 때 -->
            <div th:if="${tip.status.name() == 'REJECTED' and (tip.adminNote == null or tip.adminNote.isEmpty())}"
                 style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;margin-top:10px;">
                <p style="font-size:0.82rem;color:#dc2626;margin:0;">
                    <i class="bi bi-x-circle-fill"></i> 관리자에 의해 거절되었습니다.
                </p>
            </div>

            <!-- 관리자 메모 (검토 완료) -->
            <div th:if="${tip.status.name() == 'REVIEWED' and tip.adminNote != null and !tip.adminNote.isEmpty()}"
                 style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px 14px;margin-top:10px;">
                <p style="font-size:0.8rem;font-weight:700;color:#16a34a;margin-bottom:4px;">
                    <i class="bi bi-check-circle-fill"></i> 관리자 메모
                </p>
                <p style="font-size:0.85rem;color:#14532d;margin:0;line-height:1.5;"
                   th:text="${tip.adminNote}"></p>
            </div>

            <!-- 거절된 경우 재제보 안내 -->
            <div th:if="${tip.status.name() == 'REJECTED'}"
                 style="margin-top:12px;padding-top:12px;border-top:1px solid var(--color-border);">
                <a th:href="@{/news-tip/create}" class="btn btn-outline btn-sm">
                    <i class="bi bi-arrow-repeat"></i> 수정하여 다시 제보하기
                </a>
            </div>

        </div>
    </div>

</main>
</body>
</html>
