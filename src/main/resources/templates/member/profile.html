<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: base(~{::title}, ~{::main})}">
<head>
    <title>내 정보 수정 — 팩트로그</title>
</head>
<body>
<main class="page-narrow">

    <!-- 플래시 메시지 -->
    <div th:if="${successMessage}" class="alert alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <div class="page-header">
        <h1 class="page-title">
            <span class="title-icon" style="background:var(--blue-50);color:var(--color-primary);">👤</span>
            내 정보 수정
        </h1>
    </div>

    <!-- 계정 정보 요약 -->
    <div class="card" style="margin-bottom:1.25rem;">
        <div class="card-body" style="display:flex;align-items:center;gap:1.25rem;">
            <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);
                        color:white;display:grid;place-items:center;font-size:1.5rem;font-weight:800;flex-shrink:0;"
                 th:text="${#strings.substring(member.nickname, 0, 1)}"></div>
            <div>
                <div style="font-size:1.1rem;font-weight:800;color:var(--slate-900);" th:text="${member.nickname}"></div>
                <div style="font-size:0.85rem;color:var(--slate-500);margin-top:2px;">
                    <span th:text="${member.username}"></span>
                    &nbsp;·&nbsp;
                    <span th:text="${member.email}"></span>
                </div>
                <div style="margin-top:6px;">
                    <span th:if="${member.admin}"
                          style="display:inline-flex;align-items:center;gap:4px;background:var(--blue-50);color:var(--color-primary);
                                 border:1px solid var(--blue-200);border-radius:20px;padding:2px 10px;font-size:0.75rem;font-weight:700;">
                        <i class="bi bi-shield-fill"></i> 관리자
                    </span>
                    <span th:unless="${member.admin}"
                          style="display:inline-flex;align-items:center;gap:4px;background:var(--slate-100);color:var(--slate-600);
                                 border-radius:20px;padding:2px 10px;font-size:0.75rem;font-weight:600;">
                        <i class="bi bi-person-check"></i> 일반 회원
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- 닉네임 변경 -->
    <div class="card" style="margin-bottom:1.25rem;">
        <div class="card-header">
            <div class="card-title">
                <i class="bi bi-person-badge" style="color:var(--color-primary);"></i>
                닉네임 변경
            </div>
        </div>
        <div class="card-body">
            <div th:if="${nicknameError}" class="alert alert-error" style="margin-bottom:1rem;">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${nicknameError}"></span>
            </div>
            <form th:action="@{/member/profile/nickname}" method="post"
                  th:object="${profileRequest}">
                <div class="field">
                    <label class="label label-required">새 닉네임</label>
                    <div style="display:flex;gap:10px;">
                        <input class="input" type="text" th:field="*{nickname}"
                               th:value="${member.nickname}"
                               placeholder="새 닉네임 입력" style="flex:1;">
                        <button type="submit" class="btn btn-primary" style="white-space:nowrap;">
                            변경하기
                        </button>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('nickname')}">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <span th:errors="*{nickname}"></span>
                    </div>
                    <div style="font-size:0.78rem;color:var(--slate-400);margin-top:6px;">
                        2~20자, 다른 회원과 중복되지 않아야 합니다.
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 비밀번호 변경 -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <i class="bi bi-lock" style="color:var(--color-primary);"></i>
                비밀번호 변경
            </div>
        </div>
        <div class="card-body">
            <div th:if="${passwordFormError}" class="alert alert-error" style="margin-bottom:1rem;">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${passwordFormError}"></span>
            </div>
            <form th:action="@{/member/profile/password}" method="post"
                  th:object="${passwordRequest}" novalidate>
                <div class="field">
                    <label class="label label-required">현재 비밀번호</label>
                    <input class="input" type="password" th:field="*{currentPassword}"
                           placeholder="현재 비밀번호 입력" autocomplete="current-password">
                    <div class="field-error" th:if="${#fields.hasErrors('currentPassword')}">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <span th:errors="*{currentPassword}"></span>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;" class="field">
                    <div>
                        <label class="label label-required">새 비밀번호</label>
                        <input class="input" type="password" th:field="*{newPassword}"
                               placeholder="6자 이상" autocomplete="new-password">
                        <div class="field-error" th:if="${#fields.hasErrors('newPassword')}">
                            <i class="bi bi-exclamation-circle-fill"></i>
                            <span th:errors="*{newPassword}"></span>
                        </div>
                    </div>
                    <div>
                        <label class="label label-required">새 비밀번호 확인</label>
                        <input class="input" type="password" th:field="*{newPasswordConfirm}"
                               placeholder="재입력" autocomplete="new-password">
                        <div class="field-error" th:if="${#fields.hasErrors('newPasswordConfirm')}">
                            <i class="bi bi-exclamation-circle-fill"></i>
                            <span th:errors="*{newPasswordConfirm}"></span>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top:0.25rem;">
                    <i class="bi bi-shield-lock"></i> 비밀번호 변경
                </button>
            </form>
        </div>
    </div>

</main>
</body>
</html>
