<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: base(~{::title}, ~{::main})}">
<head>
    <title>새 비밀번호 설정 — 팩트로그</title>
</head>
<body>
<main class="auth-page">
    <div class="auth-card">
        <div class="auth-head">
            <div class="auth-logo-mark" style="background:var(--green-600);">🔒</div>
            <h2>새 비밀번호 설정</h2>
            <p>새로 사용할 비밀번호를 입력해주세요.</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/member/reset-password}" method="post"
              th:object="${resetRequest}" novalidate>
            <input type="hidden" th:field="*{token}">

            <div class="field">
                <label class="label label-required">새 비밀번호</label>
                <input class="input" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-error'"
                       type="password" th:field="*{newPassword}"
                       placeholder="6자 이상" autocomplete="new-password">
                <div class="field-error" th:if="${#fields.hasErrors('newPassword')}">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span th:errors="*{newPassword}"></span>
                </div>
            </div>

            <div class="field" style="margin-bottom:1.5rem;">
                <label class="label label-required">새 비밀번호 확인</label>
                <input class="input" th:classappend="${#fields.hasErrors('newPasswordConfirm')} ? 'is-error'"
                       type="password" th:field="*{newPasswordConfirm}"
                       placeholder="비밀번호 재입력" autocomplete="new-password">
                <div class="field-error" th:if="${#fields.hasErrors('newPasswordConfirm')}">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span th:errors="*{newPasswordConfirm}"></span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-full">
                <i class="bi bi-check-circle"></i> 비밀번호 재설정 완료
            </button>
        </form>
    </div>
</main>
</body>
</html>
