<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: base(~{::title}, ~{::main})}">
<head>
    <title>비밀번호 찾기 — 팩트로그</title>
</head>
<body>
<main class="auth-page">
    <div class="auth-card">
        <div class="auth-head">
            <div class="auth-logo-mark" style="background:var(--amber-500);">🔑</div>
            <h2>비밀번호 찾기</h2>
            <p>가입한 이메일 주소를 입력하시면<br>비밀번호 재설정 링크를 보내드립니다.</p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/member/forgot-password}" method="post">
            <div class="field" style="margin-bottom:1.25rem;">
                <label class="label" for="email">가입한 이메일</label>
                <input class="input" type="email" id="email" name="email"
                       placeholder="example@email.com" autocomplete="email" autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-full">
                <i class="bi bi-envelope"></i> 재설정 링크 보내기
            </button>
        </form>

        <div class="auth-sep">또는</div>
        <div class="auth-footer">
            비밀번호가 기억나셨나요?
            <a th:href="@{/member/login}">로그인 →</a>
        </div>
    </div>
</main>
</body>
</html>
