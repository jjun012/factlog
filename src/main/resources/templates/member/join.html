<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: base(~{::title}, ~{::main})}">
<head>
    <title>회원가입 — 팩트로그</title>
</head>
<body>
<main class="auth-page">
    <div class="auth-card" style="max-width:480px;">
        <div class="auth-head">
            <div class="auth-logo-mark">FL</div>
            <h2>회원가입</h2>
            <p>팩트로그 커뮤니티에 참여하세요</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/member/join}" method="post" th:object="${joinRequest}" novalidate>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;" class="field">
                <div>
                    <label class="label label-required" for="username">아이디</label>
                    <input class="input" th:classappend="${#fields.hasErrors('username')} ? 'is-error'"
                           type="text" th:field="*{username}" id="username" placeholder="4~20자">
                    <div class="field-error" th:if="${#fields.hasErrors('username')}">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <span th:errors="*{username}"></span>
                    </div>
                </div>
                <div>
                    <label class="label label-required" for="nickname">닉네임</label>
                    <input class="input" th:classappend="${#fields.hasErrors('nickname')} ? 'is-error'"
                           type="text" th:field="*{nickname}" id="nickname" placeholder="2~20자">
                    <div class="field-error" th:if="${#fields.hasErrors('nickname')}">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <span th:errors="*{nickname}"></span>
                    </div>
                </div>
            </div>

            <div class="field">
                <label class="label label-required" for="email">이메일</label>
                <input class="input" th:classappend="${#fields.hasErrors('email')} ? 'is-error'"
                       type="email" th:field="*{email}" id="email" placeholder="example@email.com">
                <div class="field-error" th:if="${#fields.hasErrors('email')}">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span th:errors="*{email}"></span>
                </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;" class="field" style="margin-bottom:1.5rem;">
                <div>
                    <label class="label label-required" for="password">비밀번호</label>
                    <input class="input" th:classappend="${#fields.hasErrors('password')} ? 'is-error'"
                           type="password" th:field="*{password}" id="password"
                           placeholder="6자 이상" autocomplete="new-password">
                    <div class="field-error" th:if="${#fields.hasErrors('password')}">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <span th:errors="*{password}"></span>
                    </div>
                </div>
                <div>
                    <label class="label label-required" for="passwordConfirm">비밀번호 확인</label>
                    <input class="input" th:classappend="${passwordError} != null ? 'is-error'"
                           type="password" th:field="*{passwordConfirm}" id="passwordConfirm"
                           placeholder="재입력" autocomplete="new-password">
                    <div class="field-error" th:if="${passwordError}">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <span th:text="${passwordError}"></span>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top:0.5rem;">
                가입하기
            </button>
        </form>

        <div class="auth-sep">또는</div>
        <div class="auth-footer">
            이미 계정이 있으신가요?
            <a th:href="@{/member/login}">로그인 →</a>
        </div>
    </div>
</main>
</body>
</html>
