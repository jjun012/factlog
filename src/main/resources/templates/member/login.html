<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: base(~{::title}, ~{::main})}">
<head>
    <title>로그인 — 팩트로그</title>
</head>
<body>
<main class="auth-page">
    <div class="auth-card">
        <div class="auth-head">
            <div class="auth-logo-mark">FL</div>
            <h2>다시 만나서 반가워요</h2>
            <p>팩트로그에 로그인하세요</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span>아이디 또는 비밀번호가 올바르지 않습니다.</span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/member/login}" method="post">
            <div class="field">
                <label class="label" for="username">아이디</label>
                <input class="input" type="text" id="username" name="username"
                       placeholder="아이디를 입력하세요" autocomplete="username" autofocus>
            </div>
            <div class="field" style="margin-bottom:1.5rem;">
                <label class="label" for="password">비밀번호</label>
                <input class="input" type="password" id="password" name="password"
                       placeholder="비밀번호를 입력하세요" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-full">
                로그인
            </button>
        </form>

        <div style="text-align:right;margin-top:0.75rem;">
            <a th:href="@{/member/forgot-password}"
               style="font-size:0.82rem;color:var(--slate-500);text-decoration:none;">
                비밀번호를 잊으셨나요?
            </a>
        </div>

        <div class="auth-sep">또는</div>
        <div class="auth-footer">
            아직 계정이 없으신가요?
            <a th:href="@{/member/join}">회원가입 →</a>
        </div>
    </div>
</main>
</body>
</html>
