<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: base(~{::title}, ~{::main})}">
<head>
    <title>링크 오류 — 팩트로그</title>
</head>
<body>
<main class="auth-page">
    <div class="auth-card" style="text-align:center;">
        <div style="font-size:3rem;margin-bottom:1rem;">⚠️</div>
        <h2 style="font-size:1.25rem;font-weight:800;margin-bottom:0.75rem;">링크가 유효하지 않습니다</h2>
        <div class="alert alert-error" style="text-align:left;">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span th:text="${errorMessage}">유효하지 않거나 만료된 링크입니다.</span>
        </div>
        <a th:href="@{/member/forgot-password}" class="btn btn-primary btn-full" style="margin-top:0.5rem;">
            <i class="bi bi-arrow-repeat"></i> 비밀번호 재설정 다시 요청
        </a>
        <div style="margin-top:1rem;">
            <a th:href="@{/member/login}" style="font-size:0.875rem;color:var(--slate-500);">
                로그인으로 돌아가기
            </a>
        </div>
    </div>
</main>
</body>
</html>
