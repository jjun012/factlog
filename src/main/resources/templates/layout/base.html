<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:fragment="base(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">팩트로그</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<header class="nav">
    <div class="nav-inner">
        <!-- 로고 -->
        <a class="nav-logo" th:href="@{/}">
            <div class="nav-logo-mark">FL</div>
            <span class="nav-logo-text">팩트<em>로그</em></span>
        </a>

        <!-- 메뉴 -->
        <nav class="nav-links">
            <a class="nav-link" th:href="@{/flipflop}">
                <i class="bi bi-arrow-left-right"></i><span>발언 비교</span>
            </a>
            <a class="nav-link" th:href="@{/post}">
                <i class="bi bi-chat-square-text"></i><span>커뮤니티</span>
            </a>
            <a class="nav-link hot" th:href="@{/post/hot}">
                <i class="bi bi-fire"></i><span>핫게시판</span>
            </a>
            <a sec:authorize="isAuthenticated() and !hasRole('ADMIN')" class="nav-link" th:href="@{/news-tip/create}"
               style="color:#ca8a04;">
                <i class="bi bi-newspaper"></i><span>뉴스 제보</span>
            </a>
            <a sec:authorize="hasRole('ADMIN')" class="nav-link" th:href="@{/admin/news-tip}"
               style="color:#ca8a04;">
                <i class="bi bi-newspaper"></i><span>제보 관리</span>
            </a>
        </nav>

        <!-- 로그인 영역 -->
        <div class="nav-auth">
            <div sec:authorize="isAuthenticated()" style="display:flex;align-items:center;gap:8px;">
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/ai-draft}"
                   class="btn btn-sm" style="background:#0ea5e9;color:#fff;border-color:#0ea5e9;">
                    <i class="bi bi-robot"></i> AI 분석
                </a>
                <a th:href="@{/post/create}" class="btn btn-primary btn-sm">
                    <i class="bi bi-pencil-square"></i> 글쓰기
                </a>
                <a th:href="@{/member/profile}" class="nav-user" style="text-decoration:none;">
                    <div class="nav-avatar"><i class="bi bi-person-fill" style="font-size:12px;"></i></div>
                    <span sec:authentication="name"></span>
                </a>
                <form th:action="@{/member/logout}" method="post">
                    <button type="submit" class="btn btn-outline btn-sm">로그아웃</button>
                </form>
            </div>
            <div sec:authorize="!isAuthenticated()" style="display:flex;align-items:center;gap:8px;">
                <a th:href="@{/member/login}" class="btn btn-outline btn-sm">로그인</a>
                <a th:href="@{/member/join}"  class="btn btn-primary btn-sm">회원가입</a>
            </div>
        </div>
    </div>
</header>

<div th:replace="${content}"></div>

<footer class="footer">
    <strong>팩트로그</strong> — 정치 발언 기록소<br>
    모든 발언 자료는 공식 언론 보도에 근거하며, 정치적 편향 없이 사실만을 기록합니다.
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
