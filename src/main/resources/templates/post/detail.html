<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: base(~{::title}, ~{::main})}">
<head>
    <title th:text="${post.title} + ' — 팩트로그'">게시글</title>
</head>
<body>
<main class="page-narrow">

    <div th:if="${successMessage}" class="alert alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <!-- 게시글 -->
    <div class="detail-card">
        <div class="detail-meta-row">
            <span class="badge badge-hot" th:if="${post.hot}">
                <i class="bi bi-fire"></i> HOT
            </span>
            <span class="meta-pill"><i class="bi bi-person"></i> <span th:text="${post.author.nickname}"></span></span>
            <span class="meta-pill" th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
            <span class="meta-pill"><i class="bi bi-eye"></i> <span th:text="${post.viewCount}"></span></span>
            <span class="meta-pill"><i class="bi bi-chat"></i> <span th:text="${#lists.size(post.comments)}"></span></span>
        </div>

        <h1 class="detail-title" th:text="${post.title}"></h1>

        <div class="post-body" th:text="${post.content}"></div>

        <div sec:authorize="isAuthenticated()"
             th:if="${currentMember != null and (currentMember.id == post.author.id or currentMember.admin)}"
             class="detail-action-row">
            <a th:href="@{/post/{id}/edit(id=${post.id})}" class="btn btn-outline btn-sm">
                <i class="bi bi-pencil"></i> 수정
            </a>
            <form th:action="@{/post/{id}/delete(id=${post.id})}" method="post"
                  onsubmit="return confirm('정말 삭제하시겠습니까?')">
                <button type="submit" class="btn btn-danger btn-sm">
                    <i class="bi bi-trash"></i> 삭제
                </button>
            </form>
        </div>
    </div>

    <!-- 좋아요 -->
    <div class="like-wrap">
        <div sec:authorize="isAuthenticated()">
            <button id="likeBtn" class="like-btn" th:classappend="${isLiked} ? 'liked'"
                    th:attr="data-post-id=${post.id}">
                <i class="bi bi-heart-fill"></i>
                <span id="likeCount" class="like-btn-count" th:text="${post.likeCount}"></span>
            </button>
            <div class="like-hint" th:text="${isLiked} ? '좋아요를 눌렀습니다' : '이 글이 도움이 됐나요?'"></div>
        </div>
        <div sec:authorize="!isAuthenticated()" style="text-align:center;">
            <div style="font-size:1.75rem;font-weight:900;color:var(--red-500);" th:text="${post.likeCount}"></div>
            <div style="font-size:0.8rem;color:var(--slate-400);margin:4px 0 12px;">좋아요</div>
            <a th:href="@{/member/login}" class="btn btn-outline btn-sm">로그인 후 좋아요</a>
        </div>
        <div th:if="${post.hot}" style="margin-top:14px;">
            <span class="badge badge-hot" style="padding:5px 12px;font-size:0.8rem;">
                <i class="bi bi-fire"></i> 핫게시판 등록 게시글
            </span>
        </div>
    </div>

    <!-- 댓글 -->
    <div class="comment-wrap">
        <div class="comment-head">
            <i class="bi bi-chat-dots" style="color:var(--color-primary);"></i>
            댓글
            <span class="comment-count-chip" th:text="${#lists.size(post.comments)}"></span>
        </div>

        <div sec:authorize="isAuthenticated()" class="comment-input-area">
            <form th:action="@{/comment/post/{id}(id=${post.id})}" method="post">
                <div class="comment-input-row">
                    <textarea class="comment-textarea" name="content" rows="2"
                              placeholder="댓글을 남겨보세요..."></textarea>
                    <button type="submit" class="btn btn-primary">등록</button>
                </div>
            </form>
        </div>
        <div sec:authorize="!isAuthenticated()" class="comment-login">
            <i class="bi bi-lock" style="display:block;font-size:18px;margin-bottom:6px;"></i>
            <a th:href="@{/member/login}">로그인</a> 후 댓글을 작성할 수 있습니다.
        </div>

        <div th:if="${#lists.isEmpty(post.comments)}" class="empty" style="padding:2rem;">
            <p>첫 번째 댓글을 작성해보세요!</p>
        </div>

        <div th:each="comment : ${post.comments}" class="comment-item">
            <div class="comment-avatar" th:text="${#strings.substring(comment.author.nickname, 0, 1)}"></div>
            <div class="comment-body">
                <div class="comment-meta">
                    <span class="comment-author" th:text="${comment.author.nickname}"></span>
                    <span class="comment-date" th:text="${#temporals.format(comment.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
                    <form th:if="${currentMember != null and (currentMember.id == comment.author.id or currentMember.admin)}"
                          th:action="@{/comment/{id}/delete(id=${comment.id})}" method="post"
                          style="margin-left:auto;">
                        <input type="hidden" name="redirectUrl" th:value="@{/post/{id}(id=${post.id})}">
                        <button type="submit" class="comment-del-btn"
                                onclick="return confirm('댓글을 삭제하시겠습니까?')">
                            <i class="bi bi-trash"></i> 삭제
                        </button>
                    </form>
                </div>
                <div class="comment-text" th:text="${comment.content}"></div>
            </div>
        </div>
    </div>

    <a th:href="@{/post}" class="btn btn-outline">
        <i class="bi bi-arrow-left"></i> 목록으로
    </a>

</main>
</body>
</html>
